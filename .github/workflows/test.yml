name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+ is required for built-in TypeScript type stripping
          # (--experimental-strip-types), which the test scripts rely on.
          node-version: '22'
      - run: npm install
      - run: npm test
      # Type stripping does not type-check, so check explicitly.
      - run: npx --yes typescript@5.9 tsc --noEmit --strict --module nodenext \
          --target es2022 --allowImportingTsExtensions src/*.ts test/*.ts bin/*.ts example.ts
